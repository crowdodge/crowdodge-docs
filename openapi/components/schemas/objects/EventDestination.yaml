description: 推定された予定の目的地
type: object
required: [name, latitude, longitude]
properties:
  name:
    type: string
    description: 目的地名
  latitude:
    type: number
    format: double
    minimum: -90
    maximum: 90
    description: 目的地の緯度
  longitude:
    type: number
    format: double
    minimum: -180
    maximum: 180
    description: 目的地の経度
additionalProperties: false
