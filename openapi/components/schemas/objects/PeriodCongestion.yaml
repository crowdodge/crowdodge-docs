description: ある時間帯における混雑情報
type: object
required:
  - congestionStartTime
  - congestionEndTime
  - description
  - stores
properties:
  congestionStartTime:
    description: 混雑の開始日時
    type: string
    format: date-time
    examples:
      - "2026-06-17T23:00:00+09:00"
  congestionEndTime:
    description: 混雑の終了日時
    type: string
    format: date-time
    examples:
      - "2026-06-18T00:30:00+09:00"
  description:
    description: 混雑理由や内容、注意点などの説明
    type: string
    examples:
      - "〇〇公園で花火大会が開催されているため\n〇〇駅が混雑する可能性があります。"
  stores:
    description: おすすめ店舗3つほど
    type: array
    items:
      $ref: "./Store.yaml"
    maxItems: 3
