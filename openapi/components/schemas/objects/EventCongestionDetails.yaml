description: 予定に対する時間帯別の混雑情報
type: object
required:
  - general
  - wayThere
  - between
  - wayBack
properties:
  general:
    description: |
      時間単に依存しない混雑情報。

      該当なしならnull。
    oneOf:
      - $ref: "./GeneralCongestion.yaml"
      - type: "null"
  wayThere:
    description: |
      予定に対しての行きの混雑情報。

      該当なしならnull。
    oneOf:
      - $ref: "./PeriodCongestion.yaml"
      - type: "null"
  between:
    description: |
      予定実行中の混雑情報。

      該当なしならnull。
    oneOf:
      - $ref: "./PeriodCongestion.yaml"
      - type: "null"
  wayBack:
    description: |
      予定からの帰りの混雑情報。

      該当なしならnull。
    oneOf:
      - $ref: "./PeriodCongestion.yaml"
      - type: "null"
