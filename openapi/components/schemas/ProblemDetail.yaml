type: object
required: [type, title, status, code]
properties:
  type:
    type: string
    format: uri
    pattern: "^https://crowdodge\\.grfsv\\.net/problems/[A-Z0-9_]+$"
  title:
    type: string
  status:
    type: integer
    minimum: 400
    maximum: 599
  detail:
    type:
      - string
      - "null"
  code:
    type: string
  violations:
    type: array
    items:
      $ref: "./objects/Violation.yaml"
