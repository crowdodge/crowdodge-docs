type: object
required: [calendars]
properties:
  calendars:
    type: array
    items:
      type: object
      required: [id, name, color, primary, accessRole, selected]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type:
            - string
            - "null"
        primary:
          type: boolean
        accessRole:
          type: string
          enum: [owner, writer, reader]
        selected:
          type: boolean
      additionalProperties: false
additionalProperties: false
