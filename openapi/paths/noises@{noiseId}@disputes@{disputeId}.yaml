get:
  tags:
    - Noises
  summary: "異議申し立ての確認"
  description: |
    指定したノイズに対して行った異議申し立ての確認を行う。
  operationId: getDisputes
  parameters:
    - $ref: "../components/parameters/paths/NoiseId.yaml"
    - $ref: "../components/parameters/paths/DisputeId.yaml"
  responses:
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "404":
      $ref: "../components/responses/errors/404.yaml"
    "500":
      $ref: "../components/responses/errors/500.yaml"

delete:
  tags:
    - Noises
  summary: "異議申し立ての取り下げ"
  description: |
    指定したノイズに対して行った異議申し立てを取り下げる。
  operationId: deleteDispute
  parameters:
    - $ref: "../components/parameters/paths/NoiseId.yaml"
    - $ref: "../components/parameters/paths/DisputeId.yaml"
  responses:
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "404":
      $ref: "../components/responses/errors/404.yaml"
    "409":
      $ref: "../components/responses/errors/409.yaml"
    "500":
      $ref: "../components/responses/errors/500.yaml"
