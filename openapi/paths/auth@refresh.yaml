post:
  tags: [Auth]
  operationId: refreshToken
  summary: リフレッシュトークンでトークンを再発行する
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [refreshToken]
          properties:
            refreshToken:
              type: string
              minLength: 1
          additionalProperties: false
  responses:
    "200":
      description: 再発行成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/TokenResponse.yaml"
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
