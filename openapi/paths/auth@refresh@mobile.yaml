# mobileのみ前提。
# 将来Webクライアントが増えた場合、/auth/refresh/webを生やす。

post:
  tags:
    - Auth
  summary: "アクセストークン再発行"
  description: |
    リフレッシュトークンを検証し、新しいアクセストークンを発行する。
    リフレッシュトークン自体はローテーションし、検証に使ったものは無効化（active->revoked）する。

    カレンダーアプリの都合上、refreshトークンの期限（expires_at）は、sliding expirationで30日延長最大90日。

    リフレッシュトークンが無効・期限切れの場合は401を返す。

    ---

    クライアントのフローとしては、

    1. jwtのexpを確認
    2. 期限切れまたは直近なら、
      1. refreshを叩いてjwt更新し、リクエスト
      2. 401が返った場合は、ログアウトして要認証
    3. そうでない場合は、
      1. そのままjwtを利用してリクエスト
      2. 401が返った場合は、refreshを叩いてjwt更新し、リクエスト
  operationId: refreshToken
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/requestBodies/RefreshTokenRequest.yaml"
  responses:
    "200":
      $ref: "../components/responses/RefreshToken.yaml"
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml" # refreshエンドポイントに関しては、access tokenのエラーではなくrefresh tokenエラー。
    "500":
      $ref: "../components/responses/errors/500.yaml"
