get:
  tags:
    - Auth
  summary: "OAuth認証のコールバック"
  description: |
    認証完了後サーバがユーザをDBに登録して自前のトークンを発行する。
    `redirect_url`として事前にGoogle Cloud Consoleで登録が必要。

    クエリパラメータとして認証コードとCSRF対策用のstateを受け取る。

    1. stateパラメータを検証してCSRF攻撃を防ぐ
    2. codeをGoogleのトークンエンドポイントでアクセストークンと交換する
    3. アクセストークンを利用してGoogleからユーザ情報を取得する
    4. 初回の場合はDBに新規ユーザとして登録
    5. 自前のトークンを発行してクライアントに返す
  operationId: handleGoogleOAuthCallback
