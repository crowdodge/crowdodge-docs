get:
  tags:
    - Users
  summary: "カレンダー一覧取得"
  description: |
    所有しているカレンダーの一覧を取得。
    それぞれのカレンダー要素が、id, 名前, 選択中かどうかのフラグを持つ。
  operationId: listCalendars
  responses:
    "200":
      description: "カレンダー一覧"
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/CalendarsResponse.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "403":
      $ref: "../components/responses/errors/403.yaml" # Google Calendar の権限不足
    "502":
      $ref: "../components/responses/errors/502.yaml" # Google 連携失敗
    "504":
      $ref: "../components/responses/errors/504.yaml" # Google 連携失敗

put:
  tags:
    - Users
  summary: "選択中のカレンダー変更"
  description: |
    カレンダーの選択状態を変更する。
    選択しなおしたいカレンダーIDのリストを送信することで、その状態で上書きする。
  operationId: updateSelectedCalendars
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/requestBodies/CalendarIdsRequest.yaml"
  responses:
    "204":
      description: "選択状態を更新した"
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "403":
      $ref: "../components/responses/errors/403.yaml" # Google Calendar の権限不足
    "502":
      $ref: "../components/responses/errors/502.yaml" # Google 連携失敗
    "504":
      $ref: "../components/responses/errors/504.yaml" # Google 連携失敗
