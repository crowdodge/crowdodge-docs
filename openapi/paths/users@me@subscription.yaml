get:
  tags:
    - Users
  summary: "契約中のサブスクリプション取得"
  description: |
    ユーザが現在契約しているサブスクリプションプランの除法を取得する。
  operationId: getSubscription
  responses:
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "500":
      $ref: "../components/responses/errors/500.yaml"

put:
  tags:
    - Users
  summary: "サブスクリプションの新規開始・変更"
  description: |
    ユーザのサブスクリプションを新規開始または変更する。
    リクエストボディとしてplanIdを指定する。
  operationId: updateSubscription
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/requests/PlanIdRequest.yaml"
  responses:
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "409":
      $ref: "../components/responses/errors/409.yaml"
    "422":
      $ref: "../components/responses/errors/422.yaml" # 不正なプランなど
    "500":
      $ref: "../components/responses/errors/500.yaml"
