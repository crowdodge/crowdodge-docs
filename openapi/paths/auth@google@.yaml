post:
  tags: [Auth]
  operationId: authenticateWithGoogle
  summary: Google認可コードでログインする
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/requestBodies/GoogleLoginRequest.yaml"
  responses:
    "200":
      description: 認証成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/TokenResponse.yaml"
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "403":
      $ref: "../components/responses/errors/403.yaml"
    "502":
      $ref: "../components/responses/errors/502.yaml"
    "504":
      $ref: "../components/responses/errors/504.yaml"
