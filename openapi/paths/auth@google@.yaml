get:
  tags:
    - Auth
  summary: "Google OAuth認証フロー"
  description: |
    Google OAuth認証フローを開始する。
    クライアントがこのエンドポイントにアクセスすると、
    GoogleのOAuth認証画面へのリダイレクト（302）を返す。
    実際の登録とトークン発行は`/auth/google/callback`で行われる。

    このエンドポイントの成功処理がリダイレクトのため、不要な2xx responseは意図的に設定していない。
  operationId: startGoogleOAuth
  security: []
  responses:
    "302":
      description: GoogleのOAuth認証画面リダイレクト
      headers:
        Location:
          $ref: "../components/headers/Location.yaml"
    "500":
      $ref: "../components/responses/errors/500.yaml"
