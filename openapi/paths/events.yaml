get:
  tags: [Events]
  operationId: listEventEnrichments
  summary: 同期済みGoogleイベントに対応するCrowdodge付加情報を取得する
  description: |
    サーバーが同期済みのGoogleイベントについて、
    Googleイベントを識別するIDとCrowdodge側のID・付加情報だけを返す。
    対象期間はサーバーの同期範囲に従い、この契約では期間を規定しない。
    Googleイベント本体は返さない。
    calendarIdを省略した場合は選択中の全カレンダーを対象とする。
    指定した場合は指定された選択中カレンダーだけを対象とする。
  parameters:
    - $ref: "../components/parameters/queries/CalendarId.yaml"
  responses:
    "200":
      description: カレンダー別の付加情報
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/EventsResponse.yaml"
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
