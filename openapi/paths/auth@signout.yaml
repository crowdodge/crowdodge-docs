post:
  tags: [Auth]
  operationId: signOut
  summary: リフレッシュトークンを失効する
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [refreshToken]
          properties:
            refreshToken:
              type: string
              minLength: 1
          additionalProperties: false
  responses:
    "204":
      description: サインアウト成功
    "400":
      $ref: "../components/responses/errors/400.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
