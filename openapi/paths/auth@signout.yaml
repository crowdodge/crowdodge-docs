post:
  tags:
    - Auth
  summary: "サインアウト"
  description: |
    リクエストに含まれるリフレッシュトークンをDBで無効化する。

    ただし、アクセストークン（JWT）はstatelessのため即時無効化はできず、有効期限まで残る。
    そのため、クライアント側での破棄を前提とする。
  operationId: signout
  responses:
    "204":
      $ref: "../components/responses/Signout.yaml"
    "401":
      $ref: "../components/responses/errors/401.yaml"
    "500":
      $ref: "../components/responses/errors/500.yaml"
